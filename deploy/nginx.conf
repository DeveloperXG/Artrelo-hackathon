# Reference reverse-proxy config for serving the marketing site and the SPA from
# one domain (path-split). Not wired into any pipeline yet — adapt paths, add TLS
# (e.g. with certbot), and set the correct server_name before using.
#
# Layout:
#   /                      -> marketing static export  (marketing/out)
#   /pricing /about ...    -> marketing static export
#   /login /signup ...     -> SPA build                (frontend/dist)
#   /portal /dashboard ... -> SPA build
#   /vendor-response /vendor-job /vendor-hub -> SPA build (token + hub routes)
#   /api/                  -> Express backend          (127.0.0.1:5500)

server {
    listen 80;
    server_name artrelo.com;

    # --- API: Express backend ---
    location /api/ {
        proxy_pass http://127.0.0.1:5500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA client routes (React Router). Any unknown sub-path under these
    #     falls back to the SPA's index.html so the router can handle it. ---
    location ~ ^/(login|signup|landlord-signup|portal|dashboard|requests|vendor-response|vendor-job|vendor-hub)(/|$) {
        root /var/www/artrelo/app;          # = frontend/dist
        try_files /index.html =404;
    }

    # --- SPA build assets. Vite emits /assets/*; no collision with Next's
    #     /_next/*, which is served from the marketing root below. ---
    location /assets/ {
        root /var/www/artrelo/app;          # = frontend/dist
        try_files $uri =404;
    }

    # --- Marketing static export (default). trailingSlash:false means routes
    #     are emitted as /pricing.html etc., so resolve $uri then $uri.html. ---
    location / {
        root /var/www/artrelo/marketing;    # = marketing/out
        try_files $uri $uri.html $uri/index.html /404.html;
    }
}
