<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1215" />
    <!-- App-owned icons from src/assets/brand, which Vite fingerprints under
         /assets/. Not the root /favicon.ico etc.: in production those root
         URLs are served by the marketing app (deploy/Caddyfile.railway). -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/src/assets/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/brand/apple-touch-icon.png" />
    <!-- This SPA is the authenticated app shell (auth, tenant portal, landlord
         dashboard). Public marketing pages live in the separate Next.js app, so
         the app shell should never be indexed. -->
    <meta name="robots" content="noindex" />
    <title>Artrelo</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
